name: HACS validation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands: no logo in home-assistant/brands yet.
          # description/topics: set them on GitHub before going public, then remove from this list.
          ignore: brands description topics
